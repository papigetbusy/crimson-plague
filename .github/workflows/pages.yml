# On every push to main: guard + referee tests, build the page, publish to GitHub Pages.
# Anything red stops everything; the last good version stays live.
name: Test, build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Architecture guard
        run: node tools/guard.js
      - name: Referee tests
        run: node tests/referee.test.js
      - name: Model checks
        run: node tests/models.test.js
      - name: Core loop checks
        run: node tests/loop.test.js
      - name: Controller checks
        run: node tests/pad.test.js
      - name: Touch button settings checks
        run: node tests/touch.test.js
      - name: Effect checks
        run: node tests/fx.test.js
      - name: Gun look checks
        run: node tests/gun.test.js
      - name: Hall look tests
        run: node tests/world.test.js
      - name: Floor tests
        run: node tests/floor.test.js
      - name: Monster tests
        run: node tests/monsters.test.js
      - name: Monster rig tests
        run: node tests/rigs.test.js
      - name: Build the page
        run: node tools/build.js "build-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
      - name: Publish previews and models
        run: |
          [ -d preview ] && cp -r preview site/preview || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
